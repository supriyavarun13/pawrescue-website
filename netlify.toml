[build]
  publish   = "public"
  functions = "netlify/functions"

[dev]
  command = "echo 'No build step needed'"
  port    = 8888

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
